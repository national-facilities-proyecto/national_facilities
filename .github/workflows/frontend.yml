name: Django React PostgreSQL
on:
  push:
    paths: ['frontend/**', 'backend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pull the official image from ECR Public to avoid Docker Hub rate limits.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: nf_integration
          POSTGRES_USER: nf_test
          POSTGRES_PASSWORD: integration-only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U nf_test -d nf_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: nf_integration
      POSTGRES_USER: nf_test
      POSTGRES_PASSWORD: integration-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '55432'
      NF_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv ../.venv
      - run: ../.venv/bin/python -m pip install -r ../backend/requirements.txt
      - run: ../.venv/bin/python ../backend/manage.py check --settings=config.test_settings
      - run: ../.venv/bin/python ../backend/manage.py makemigrations --check --settings=config.test_settings
      - run: ../.venv/bin/python ../backend/manage.py test core --settings=config.test_settings --noinput
      - run: ../.venv/bin/python ../backend/manage.py migrate --settings=config.test_settings
      - run: ../.venv/bin/python ../backend/test_support/seed.py
      - run: |
          mkdir -p ../.integration
          nohup ../.venv/bin/python -u ../backend/manage.py runserver 127.0.0.1:8000 --settings=config.test_settings --noreload > ../.integration/backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/; then exit 0; fi
            sleep 1
          done
          cat ../.integration/backend.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:api
      - run: node scripts/check-api-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: |
            frontend/coverage
            frontend/playwright-report
            frontend/test-results
            .integration/backend.log
